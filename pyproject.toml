[project]
name = "saber-football"
version = "0.1.0"
description = "Savepoint Analytics - reproducible NFL/NCAA football sabermetrics platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Oswald", email = "alex@savepointanalytics.com" }]

dependencies = [
    "nflreadpy>=0.1.5",
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandera>=0.20",
    "requests>=2.32",
    "tenacity>=8.4",
    "typer>=0.12",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
warehouse = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "dbt-duckdb>=1.8",
]
orchestration = [
    "prefect>=3.0",
]
modeling = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.4",
    "statsmodels>=0.14",
    "pymc>=5.16",
    "bambi>=0.13",
    "mlflow>=2.14",
]
serving = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
football-ingest = "src.ingestion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
