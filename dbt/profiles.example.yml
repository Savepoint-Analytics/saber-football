saber_football:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: ../data/football.duckdb
    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', 5432) | int }}"
      user: "{{ env_var('POSTGRES_USER', 'saber') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'change-me') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'saber_football') }}"
      schema: public
      threads: 4
